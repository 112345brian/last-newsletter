[project]
name = "last-newsletter-adapter-publish"
version = "0.1.0"
description = "DigestPublisher adapter: renders a core.Digest to an output format (Markdown file to start; HTML email / static feed later). Implements the port defined in last-newsletter-core."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
