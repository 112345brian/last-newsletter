[project]
name = "last-newsletter-adapter-venues"
version = "0.1.0"
description = "Venue-specific implementations of core's EventSource port for rooms that publish a JSON feed of their own (Lodge Room via WordPress, Scribble via its Sanity CMS). One small module per venue, sharing one HTTP client."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
