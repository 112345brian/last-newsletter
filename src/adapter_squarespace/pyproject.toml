[project]
name = "last-newsletter-adapter-squarespace"
version = "0.1.0"
description = "Squarespace events-page implementation of core's EventSource port: any Squarespace site with an events collection publishes its upcoming events as JSON at ?format=json, and a venue or promoter becomes a source by configuration."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
