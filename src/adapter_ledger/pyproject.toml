[project]
name = "last-newsletter-adapter-ledger"
version = "0.1.0"
description = "SQLite implementation of the event-ledger EventRepository port: durable events, cited mentions, possible-duplicate links, and owner state kept apart from extracted fields."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
    "ranked-digest",
    "process-lock",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }
ranked-digest = { workspace = true }
process-lock = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
