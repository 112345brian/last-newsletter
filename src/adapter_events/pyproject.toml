[project]
name = "last-newsletter-adapter-events"
version = "0.1.0"
description = "EventExtractor backed by a local Ollama model: pre-filter, schema-constrained extraction, evidence guard, optional (off by default) cloud escalation seam. Standard library only."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
