[project]
name = "last-newsletter-cli"
version = "0.1.0"
description = "Composition root. Wires a concrete EmailSource + Summarizer + DigestPublisher + DigestRepository, and optionally a RelevanceWeigher, into core's BuildDigestUseCase, and the digest browser, and runs them. The only package allowed to import every other package."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
    "ranked-digest",
    "last-newsletter-adapter-email",
    "last-newsletter-adapter-summarizer",
    "last-newsletter-adapter-publish",
    "last-newsletter-adapter-storage",
    "last-newsletter-adapter-web",
    "last-newsletter-adapter-knowledge",
    "last-newsletter-adapter-ledger",
    "last-newsletter-adapter-semantic",
    "last-newsletter-adapter-events",
    "last-newsletter-adapter-ticketmaster",
    "process-lock",
]

[project.scripts]
last-newsletter = "last_newsletter_cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }
ranked-digest = { workspace = true }
last-newsletter-adapter-email = { workspace = true }
last-newsletter-adapter-summarizer = { workspace = true }
last-newsletter-adapter-publish = { workspace = true }
last-newsletter-adapter-storage = { workspace = true }
last-newsletter-adapter-web = { workspace = true }
last-newsletter-adapter-knowledge = { workspace = true }
last-newsletter-adapter-ledger = { workspace = true }
last-newsletter-adapter-semantic = { workspace = true }
last-newsletter-adapter-events = { workspace = true }
last-newsletter-adapter-ticketmaster = { workspace = true }
process-lock = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
