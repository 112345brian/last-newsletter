[project]
name = "last-newsletter-adapter-summarizer"
version = "0.1.0"
description = "Summarizer adapter: calls an LLM (via llmhost's provider registry, Claude by default, bring-your-own-key) to turn a batch of EmailMessages into cross-source themes. Implements the port defined in last-newsletter-core."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
    "ranked-digest",
    "llmhost",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }
ranked-digest = { workspace = true }
llmhost = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
