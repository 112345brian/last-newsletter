[project]
name = "last-newsletter-adapter-storage"
version = "0.1.0"
description = "DigestRepository adapter: persists digests as flat JSON files so past ones can be browsed later. Implements the port defined in last-newsletter-core."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "concert-tracker-core",
    "last-newsletter-core",
    "ranked-digest",
    "process-lock",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
concert-tracker-core = { workspace = true }
last-newsletter-core = { workspace = true }
ranked-digest = { workspace = true }
process-lock = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
