[project]
name = "last-newsletter-adapter-ticketmaster"
version = "0.1.0"
description = "Ticketmaster Discovery API implementation of core's EventSource port: music events for a city and date window, mapped to event candidates that carry the API's own id and url."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "last-newsletter-core",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
last-newsletter-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
