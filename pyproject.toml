[project]
name = "last-newsletter"
version = "0.1.0"
description = "Self-hosted workspace root for Last Newsletter. No code of its own — see packages/."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/adapter_email",
    "packages/adapter_summarizer",
    "packages/adapter_publish",
    "packages/cli",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "PLR2004", "ARG002"]
"**/adapter_*/**" = ["ARG002"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["packages"]
