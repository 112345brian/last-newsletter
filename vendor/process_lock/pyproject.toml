[project]
name = "process-lock"
version = "0.0.0"
description = "Cross-platform, cross-process exclusive file lock with an explicit timeout policy, and a rename that retries on Windows."
requires-python = ">=3.11"
dependencies = ["filelock", "tenacity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
