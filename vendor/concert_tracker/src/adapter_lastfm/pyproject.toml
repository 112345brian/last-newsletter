[project]
name = "concert-tracker-adapter-lastfm"
version = "0.1.0"
description = "Last.fm implementation of core's ArtistTagSource and ListeningHistory ports: an artist's genres (crowd tags) and the owner's recent play counts, with a local cache. Personal, non-commercial use under the Last.fm API terms."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "concert-tracker-core",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.uv.sources]
concert-tracker-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
