[project]
name = "concert-tracker-core"
version = "0.1.0"
description = "Entities, use cases and ports for the Concert Tracker event ledger: what counts as the same event, how a listing is validated, and how documents from any source are ingested. No framework, I/O or adapter code."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
]

[tool.uv.sources]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
