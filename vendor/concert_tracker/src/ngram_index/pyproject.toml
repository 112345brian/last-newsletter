[project]
name = "concert-tracker-ngram-index"
version = "0.1.0"
description = "Local, offline similar-event index: hashed character n-gram vectors persisted in SQLite. Proposes possible-duplicate candidates only; never merges."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
