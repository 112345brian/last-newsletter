[project]
name = "tracker-state"
version = "0.0.0"
description = "The tracker contract's record and action shapes (docs/tracker-contract.md, #1478 D1): generic, I/O-free types for a board that renders records into sections and runs named actions, independent of any domain."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker_state"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
