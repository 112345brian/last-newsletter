[project]
name = "urgency"
version = "0.0.0"
description = "Survival curves (Kaplan-Meier) and one 'days until expected to be gone' number for dated and open-ended items."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urgency"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
