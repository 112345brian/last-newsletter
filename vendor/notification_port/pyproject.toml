[project]
name = "notification_port"
version = "0.0.0"
description = "The notification port (Notifier protocol, NotifyResult), an ntfy HTTP transport, and the pure ntfy spool/retry/request policy."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_port"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
