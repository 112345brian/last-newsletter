[project]
name = "text_normalize"
version = "0.0.0"
description = "Normalize free text and organisation names into stable comparison keys (text, space, fold, words, slug, org)."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_normalize"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
