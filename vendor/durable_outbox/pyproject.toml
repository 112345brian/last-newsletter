[project]
name = "durable-outbox"
version = "0.0.0"
description = "A durable local outbox for writes to a remote store: write-ahead entries with leases, crash recovery, a quarantine for corrupt files and a single guarded drainer."
requires-python = ">=3.11"
dependencies = ["process_lock", "psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_outbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
process-lock = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]
