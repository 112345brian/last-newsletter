[project]
name = "usage_ledger_port"
version = "0.0.0"
description = "The usage-ledger port: a Protocol for reading ledger rows and recording a skipped-for-budget row, plus a bind slot that fails loudly when unbound."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_ledger_port"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
