[project]
name = "source_dates"
version = "0.0.0"
description = "Resolve a date a source reported (an ISO timestamp, or text like 'Posted 2 days ago') to a calendar date against the time it was observed."
requires-python = ">=3.11"
dependencies = ["dateparser>=1.4.3,<2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_dates"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
