name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install every workspace package and the architecture gate
        run: uv sync --all-packages
      - name: Check (test, lint, format, types, import boundaries, arch)
        run: make check
