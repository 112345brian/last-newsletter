# Vendored shared libraries. Source of truth: one standalone repo per library under github.com/112345brian (<name with dashes>), tagged v*.
# Update with `uvx dfetch update`; never hand-edit vendor/. Consumer-specific changes live in patches/ and are
# re-applied by dfetch (regenerate with `uvx dfetch update-patch <name>` after editing the vendored copy).
manifest:
  version: '0.0'
  remotes:
    - name: github
      url-base: https://github.com/112345brian
  projects:
    - name: process_lock
      dst: vendor/process_lock
      repo-path: process-lock.git
      tag: v0.1.1
    # One private repo. dfetch cannot copy a nested package whose own directory holds a `src/`, so the
    # whole repo comes in and `ignore` prunes what this project does not import: the source adapters,
    # the CLI, the embedding backend, the tests (concert-tracker runs those) and its own vendored copy
    # of process_lock (this repo has its own).
    - name: concert_tracker
      dst: vendor/concert_tracker
      repo-path: concert-tracker.git
      tag: v0.2.1
      ignore:
        - src/adapter_ticketmaster
        - src/adapter_frequentflyer
        - src/adapter_ical
        - src/adapter_squarespace
        - src/adapter_venues
        - src/adapter_embeddings
        - src/cli
        - "src/*/tests"
        - vendor
        - docs
        - Makefile
        - uv.lock
        - dfetch.yaml
        - arborescent.toml
        - .github
        - .arborescent
        - pyproject.toml
