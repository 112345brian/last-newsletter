[project]
name = "http-transport"
version = "0.1.0"
description = "One stdlib HTTP transport for the whole workspace: GET and POST over http.client with no redirects, no proxies and no scheme surprises, returning status, headers and body. Injectable, so tests need no socket. Domain-agnostic and dependency-free."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
