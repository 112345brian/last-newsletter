[project]
name = "text-match"
version = "0.1.0"
description = "Literal, whole-word text matching with no stemming, fuzziness, or model: normalize a term (NFC, whitespace-collapsed, casefolded) and find it as a whole word in text. Domain-agnostic, zero dependencies."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
