[project]
name = "llmhost"
version = "0.1.0"
description = "LLM access as a leaf package: a provider registry (Claude now, more pluggable later) behind one tool-forced completion call, plus a per-call token usage ledger. Domain-agnostic: no newsletter, no app-specific concept anywhere in it."
readme = "README.md"
authors = [
    { name = "112345brian", email = "11creepman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
